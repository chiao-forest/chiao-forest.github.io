<head>

    <!-- 引入森林系字體與圖示 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --forest-green: #2d4628;
            --leaf-green: #5d8233;
            --cream: #f4f7f1;
            --wood-brown: #8b5a2b;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            background-color: var(--cream);
            color: #333;
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1550966841-39f460a6d531?auto=format&fit=crop&q=80'); /* 建議換成你店面的特寫圖 */
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .logo-title { font-size: 3em; letter-spacing: 4px; margin-bottom: 10px; }
        .sub-title { font-size: 1.2em; opacity: 0.9; }

        /* --- Section --- */
        .container { max-width: 800px; margin: auto; padding: 40px 20px; }
        .section-title {
            text-align: center;
            color: var(--forest-green);
            border-bottom: 2px solid var(--leaf-green);
            display: inline-block;
            margin-bottom: 30px;
            width: 100%;
            padding-bottom: 10px;
        }

        /* --- Menu --- */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .menu-item { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .menu-name { font-weight: bold; color: var(--forest-green); }
        .menu-price { float: right; color: var(--wood-brown); }

        /* --- Buttons --- */
        .cta-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 30px; }
        .btn {
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-google { background: #4285F4; color: white; }
        .btn-line { background: #06C755; color: white; }
        .btn-ig { background: #E1306C; color: white; }
        .btn-fb { background: #1877F2; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* --- Info --- */
        .info-card { background: white; padding: 25px; border-radius: 15px; margin-top: 20px; text-align: center; }
        
        footer { text-align: center; padding: 40px; font-size: 0.8em; color: #888; }
        .admin-link { color: #eee; text-decoration: none; font-size: 0.7em; }
    </style>
</head>

        </section>

            <div class="menu-grid">

                    <a href="https://www.google.com/maps/search/?api=1&query=CHiAO森林雞蛋糕" target="_blank" class="btn btn-google">
                        <i class="fab fa-google"></i> Google 地圖導航

                        <i class="fab fa-line"></i> LINE 訂購

                    <a href="你的IG網址" target="_blank" class="btn btn-ig">
                        <i class="fab fa-instagram"></i> Instagram
                    </a>

            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2024 CHiAO 森林雞蛋糕 版權所有</p>

</html>
